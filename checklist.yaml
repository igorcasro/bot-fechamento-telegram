# Checklist de fechamento do restaurante.
# Edite à vontade: cada etapa vira uma mensagem no Telegram pedindo a(s) foto(s).
#
# Campos de cada etapa:
#   titulo:      nome curto da etapa
#   instrucao:   o que o funcionário deve fotografar
#   fotos:       quantas fotos são necessárias (padrão: 1)
#   obrigatoria: false = pode ser pulada com /pular (padrão: true)

nome: "Fechamento da Loja"

etapas:
  - titulo: "Cozinha - fogão e chapa"
    instrucao: "Fogão, chapa e fritadeira desligados e limpos."

  - titulo: "Cozinha - bancadas"
    instrucao: "Bancadas higienizadas e sem sobras de alimentos."

  - titulo: "Câmara fria / geladeiras"
    instrucao: "Portas bem fechadas e alimentos cobertos e identificados."
    fotos: 2

  - titulo: "Salão"
    instrucao: "Mesas limpas, cadeiras no lugar e chão varrido."
    fotos: 2

  - titulo: "Banheiros"
    instrucao: "Banheiros limpos e com papel/sabonete repostos."

  - titulo: "Lixo"
    instrucao: "Lixeiras esvaziadas e lixo levado para fora."
    obrigatoria: false

  - titulo: "Caixa"
    instrucao: "Caixa fechado e valores guardados no cofre."

  - titulo: "Portas e luzes"
    instrucao: "Luzes apagadas, ar-condicionado desligado e porta trancada."
